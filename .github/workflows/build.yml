name: Build Godot Workshop Utility

on:
  push:
    tags:
      - '*'
    branches:
      - 'godot4'
env:
  GODOT_VERSION: 4.6.3
  EXPORT_NAME: GodotWorkshopUtility
  PROJECT_PATH: godot-workshop-utility

jobs:
  export:
    name: Export Godot Workshop Utility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    container:
      image: barichello/godot-ci:4.6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -v -p build/windows
          mkdir -v -p build/linux
          mkdir -v -p build/mac
      - name: Build
        run: |
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "windows" "$EXPORT_DIR/windows/$EXPORT_NAME.exe"
          godot --headless --verbose --export-release "linux" "$EXPORT_DIR/linux/$EXPORT_NAME.x86_64"
          godot --headless --verbose --export-release "macos" "$EXPORT_DIR/mac/$EXPORT_NAME.zip"
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: build/windows
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: build/linux
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mac
          path: build/mac
